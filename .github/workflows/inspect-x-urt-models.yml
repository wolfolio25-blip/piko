name: Inspect stock X model names (temporary)

on:
  push:
    branches: [fix/native-feeds-and-drawer-bookmarks-vantage12]
    paths: ['.github/workflows/inspect-x-urt-models.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate original JSON tweet/status parser class names
        run: |
          set -euo pipefail
          mkdir -p /tmp/inspect
          gh release download stock-cache -R pmaxhogan/vantage -p "com.twitter.android-12.19.1-release.0.apkm" -O /tmp/inspect/stock.apkm
          unzip -p /tmp/inspect/stock.apkm base.apk > /tmp/inspect/base.apk
          python3 - <<'PY'
          import zipfile,re
          with zipfile.ZipFile('/tmp/inspect/base.apk') as z:
            allnames=set()
            for path in z.namelist():
              if not re.fullmatch(r'classes\d*\.dex',path):continue
              buf=z.read(path)
              matches=re.findall(rb'Lcom/twitter/model/json/[A-Za-z0-9_/$]{2,150};',buf)
              for m in matches:
                key=m.decode('ascii','ignore')
                if any(term in key.lower() for term in ('tweet','status','quote','reply','user')):
                  allnames.add(key)
            for name in sorted(allnames)[:350]: print(name)
          PY

      - name: Inspect quote and reply fields in X Tweet data models
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip -o /tmp/inspect/jadx.zip
          unzip -q /tmp/inspect/jadx.zip -d /tmp/inspect/jadx
          chmod +x /tmp/inspect/jadx/bin/jadx
          for klass in com.twitter.model.json.core.JsonTweetResults com.twitter.model.core.d; do
            echo "::group::MODEL $klass"
            timeout 150 /tmp/inspect/jadx/bin/jadx --no-res --no-imports --no-debug-info -j 4               --single-class "$klass" --single-class-output /tmp/inspect/class.java               /tmp/inspect/base.apk || true
            if test -f /tmp/inspect/class.java; then
              grep -n -i -C 5 -E 'quote|retweet|reply|quoted|statusid|this.Z|\.Z|JsonField' /tmp/inspect/class.java | head -400 || true
              rm /tmp/inspect/class.java
            fi
            echo "::endgroup::"
          done
