name: Validate XChat backport (no release)
on:
  push:
    branches:
      - fix/xchat-client-version
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test existing extensions and Piko patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :extensions:twitter:testDebugUnitTest :patches:buildAndroid --no-daemon --console=plain
      - name: Upload draft bundle without publishing
        uses: actions/upload-artifact@v4
        with:
          name: xchat-backport-draft
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: warn
